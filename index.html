<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>UMEKO</title>
<meta name="description" content="Финансовый портал UMEKO">
<meta name="theme-color" content="#f5f5f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<!-- iPhone: иконка, название и режим «как приложение» -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="UMEKO">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<!-- Android: файл приложения -->
<link rel="manifest" href="manifest.webmanifest">
<style>
  :root {
    --page: radial-gradient(900px 560px at 10% -10%, rgba(0,113,227,.20), transparent 62%),
            radial-gradient(760px 480px at 105% 0%, rgba(48,176,199,.18), transparent 60%),
            radial-gradient(800px 560px at 50% 112%, rgba(175,82,222,.12), transparent 62%), #f5f5f7;
    --ink: #1d1d1f; --muted: #6e6e73; --accent: #0071e3; --card: rgba(255,255,255,.66); --line: rgba(0,0,0,.08); --edge: rgba(255,255,255,.7);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --page: radial-gradient(900px 560px at 10% -10%, rgba(10,132,255,.26), transparent 62%),
              radial-gradient(760px 480px at 105% 0%, rgba(64,200,224,.16), transparent 60%),
              radial-gradient(800px 560px at 50% 112%, rgba(191,90,242,.14), transparent 62%), #000;
      --ink: #f5f5f7; --muted: #98989d; --accent: #0a84ff; --card: rgba(28,28,30,.62); --line: rgba(255,255,255,.1); --edge: rgba(255,255,255,.08);
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body { background: var(--page); background-attachment: fixed; color: var(--ink); -webkit-font-smoothing: antialiased;
         font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI Variable Display", "Segoe UI", Roboto, sans-serif;
         min-height: 100vh; display: grid; place-items: center;
         padding: max(28px, env(safe-area-inset-top)) 20px max(28px, env(safe-area-inset-bottom)); }
  .box { max-width: 400px; width: 100%; text-align: center; display: grid; gap: 16px; justify-items: center;
         background: var(--card); -webkit-backdrop-filter: saturate(180%) blur(22px); backdrop-filter: saturate(180%) blur(22px);
         border: 1px solid var(--line); border-radius: 28px; padding: 34px 26px 26px;
         box-shadow: 0 20px 60px rgba(0,0,0,.10), inset 0 1px 0 var(--edge); }
  .logo { width: 92px; height: 92px; border-radius: 22px; box-shadow: 0 12px 30px rgba(0,113,227,.32); }
  h1 { margin: 4px 0 0; font-size: 30px; font-weight: 700; letter-spacing: -.03em; }
  .sub { margin: -8px 0 4px; color: var(--muted); font-size: 15px; }
  p { margin: 0; color: var(--muted); line-height: 1.5; font-size: 15px; }
  a.btn { display: block; width: 100%; background: var(--accent); color: #fff; text-decoration: none; font-weight: 600; font-size: 17px;
          padding: 14px 20px; border-radius: 14px; box-shadow: 0 8px 20px rgba(0,113,227,.3); }
  a.btn:active { transform: scale(.98); }
  .how { text-align: left; width: 100%; background: rgba(127,127,127,.08); border-radius: 16px; padding: 14px 16px; font-size: 14px; color: var(--muted); line-height: 1.6; }
  .how b { color: var(--ink); font-weight: 600; display: block; margin-bottom: 4px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
  <div class="box">
    <img class="logo" src="icon-512.png" alt="UMEKO">
    <h1>UMEKO</h1>
    <p class="sub">Финансовый портал</p>
    <p id="wait" hidden>Открываю портал…</p>
    <a class="btn" id="open" href="#">Открыть портал</a>
    <div class="how" id="how">
      <b>Как поставить на экран «Домой»</b>
      iPhone: в Safari нажмите «Поделиться» → «На экран „Домой“» → «Добавить».<br>
      Android: в Chrome меню ⋮ → «Добавить на главный экран» или «Установить приложение».
    </div>
  </div>
<script>
  // Ссылка на портал (веб-приложение Google Apps Script). Сам портал не меняется и работает и без этого ярлыка.
  var PORTAL_URL = "https://script.google.com/macros/s/AKfycbzOVp5Hs7mcM7tSJw8oGn7HAS-iTaFUkLE7gUMip0jLVvUzlU6KpnKWJ16blZgKsPgrVA/exec";
  document.getElementById("open").href = PORTAL_URL;
  // Запущено с иконки на экране «Домой» — сразу переходим в портал.
  // В обычном браузере остаёмся на этой странице, иначе iPhone добавит на экран «Домой» не ярлык, а страницу Google.
  var standalone = window.navigator.standalone === true || window.matchMedia("(display-mode: standalone)").matches;
  if (standalone) {
    document.getElementById("wait").hidden = false;
    document.getElementById("how").hidden = true;
    location.replace(PORTAL_URL);
  }
</script>
</body>
</html>
